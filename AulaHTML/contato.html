<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        /* Aqui começam os estilos CSS, que controlam como a página fica bonita */
        body {
            /* O 'body' é o corpo da página inteira. Aqui definimos a aparência geral */
            font-family: Arial, sans-serif; /* Escolhe a fonte das letras, como Arial. 'sans-serif' significa sem 'pés' nas letras, para ficar limpo */
            background-color: #a5d6a7; /* Cor de fundo da página, um verde médio */
            margin: 0; /* Remove margens externas da página */
            padding: 30px; /* Espaço interno ao redor do conteúdo, como uma borda invisível */
            color: #333; /* Cor do texto padrão, um cinza escuro */
        }
        .container {
            /* '.container' é uma classe que agrupa o conteúdo principal, como uma caixa */
            max-width: 800px; /* Largura máxima da caixa, para não ficar muito larga em telas grandes */
            margin: 0 auto; /* Centraliza a caixa na página (0 cima/baixo, auto esquerda/direita) */
            background-color: white; /* Fundo branco para a caixa */
            padding: 30px; /* Espaço interno dentro da caixa */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Sombra leve ao redor da caixa para dar profundidade */
            border-radius: 8px; /* Cantos arredondados da caixa */
        }
        h1 {
            /* 'h1' é o título principal, como o nome da página de contato */
            color: #1b5e20; /* Cor verde muito escura para o título */
            text-align: center; /* Alinha o texto no centro */
            margin-bottom: 30px; /* Espaço embaixo do título */
            font-size: 2.5em; /* Tamanho da fonte, maior que o normal (2.5 vezes) */
        }
        h2 {
            /* 'h2' são os subtítulos, como 'Dados Pessoais' */
            color: #2e7d32; /* Cor verde escura para os subtítulos */
            border-bottom: 2px solid #81c784; /* Linha verde média embaixo do subtítulo */
            padding-bottom: 10px; /* Espaço entre o texto e a linha */
            margin-top: 40px; /* Espaço em cima do subtítulo */
            margin-bottom: 20px; /* Espaço embaixo do subtítulo */
            font-size: 1.8em; /* Tamanho da fonte, um pouco maior */
        }
        p {
            /* 'p' são os parágrafos, como o endereço e telefone */
            line-height: 1.6; /* Altura da linha, para o texto não ficar apertado */
            margin: 10px 0; /* Espaço em cima e embaixo de cada parágrafo */
            font-size: 1.1em; /* Tamanho da fonte, um pouco maior que o padrão */
        }
        a {
            /* 'a' são os links, como o email */
            color: #388e3c; /* Cor verde escura para os links */
            text-decoration: none; /* Remove o sublinhado padrão dos links */
            font-weight: bold; /* Deixa o texto dos links em negrito */
        }
        a:hover {
            /* ':hover' é quando o mouse passa sobre o link */
            text-decoration: underline; /* Adiciona sublinhado ao passar o mouse */
        }
        hr {
            /* 'hr' é a linha horizontal que separa seções */
            border: none; /* Remove a borda padrão */
            border-top: 1px solid #81c784; /* Adiciona uma linha verde média no topo */
            margin: 30px 0; /* Espaço em cima e embaixo da linha */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contato - Pedro Pinheiro</h1>
        <hr>
        <h2>Dados Pessoais</h2>
            <p><strong>Rua:</strong>Número 04</p>
            <p><strong>Cidade:</strong>Amparo-SP</p>
            <p><strong>Telefone:</strong>19-978255298</p>
            <p><strong>Email:</strong> <a href="mailto:pedropinheiro.devs@gmail.com">pedropinheiro.devs@gmail.com</a></p>
            <hr>
            <a href="index.html">Clique aqui para acessar minha página de currículo</a>
    </div>
</body>
</html>
